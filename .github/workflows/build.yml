name: build & test

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Get Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          
      - run: npm install -g corepack
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn build
